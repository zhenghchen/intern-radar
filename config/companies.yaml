# Custom big-tech endpoints (no public ATS). Turn any off with false.
custom:
  amazon: true
  google: true
  apple: true
  microsoft: true
  uber: false   # careers RPC (loadSearchJobsResults) was removed; Uber roles still arrive via the aggregator lists
  eightfold:
    - [explore.jobs.netflix.net, netflix.com, Netflix]
    - [careers.qualcomm.com, qualcomm.com, Qualcomm]

# Companies you know are good. The daily discover job reports any that have no job board being polled
# (data/coverage.json and the end of the discover log), so a gap shows up instead of going unnoticed.
must_cover:
  - Dedalus Labs
  - SideShift

# VC portfolio job boards: every internship at each fund's portfolio companies. Checked every
# `every_minutes`; the daily discover job also reads their company lists (investors, stage, size).
vc_boards:
  every_minutes: 30
  consider:   # [domain, board id, fund name]
    - [jobs.sequoiacap.com, sequoia-capital, Sequoia Capital]
    - [jobs.lsvp.com, lightspeed, Lightspeed]
    - [jobs.kleinerperkins.com, kleiner-perkins, Kleiner Perkins]
    - [jobs.gv.com, gv, GV]
    - [jobs.felicis.com, felicis, Felicis]
    - [jobs.bvp.com, bessemer-ventures, Bessemer Venture Partners]
    - [jobs.firstround.com, first-round-capital, First Round Capital]
    - [jobs.usv.com, union-square-ventures, Union Square Ventures]
    - [careers.nea.com, nea, NEA]
    - [jobs.crv.com, crv, CRV]
    - [jobs.battery.com, battery-ventures, Battery Ventures]
    - [jobs.initialized.com, initialized, Initialized Capital]
    - [jobs.contrary.com, contrary, Contrary]
    - [jobs.baincapitalventures.com, bain-ventures, Bain Capital Ventures]
    - [jobs.costanoa.vc, costanoa-ventures, Costanoa Ventures]
  getro:      # [network id, fund name]
    - [222, General Catalyst]
    - [8672, Accel]
    - [257, Khosla Ventures]
    - [2105, Thrive Capital]
    - [246, Insight Partners]
    - [103, Lux Capital]
