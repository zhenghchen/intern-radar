  a16z: true

# Company signal: how strong a company's backing is. The best-known investor's weight counts,
# +1 when a second investor weighs 2 or more. Names match case-insensitively anywhere in an investor's name.
signal:
  investors:
    'sequoia|andreessen|a16z|benchmark|founders fund|accel|greylock|kleiner|lightspeed|index ventures|general catalyst|khosla|thrive': 3
    'y combinator|\bgv\b|google ventures|bessemer|first round|union square|\busv\b|\bnea\b|new enterprise|insight partners|\blux\b|8vc|felicis|\bcrv\b|menlo|craft|coatue|conviction|elad gil|initialized|battery|dcvc|notable|bain capital ventures|spark capital|\bivp\b|redpoint|ribbit|paradigm|tiger global|iconiq|greenoaks|abstract ventures': 2
    'sv angel|contrary|nfx|primary|uncork|lerer|fifth wall|costanoa|madrona|south park commons|pear|soma|boxgroup|neo\b': 1
  watchlist: 4      # big-tech watchlist companies
  max_team_size: 2000   # bigger VC-backed companies count as "other", not "startup"

# What counts as a startup on the board. Companies on startup job sites (Ashby, Greenhouse, Lever...)
# count only if their board is small; YC companies count up to a team size.
startup:
  max_open_roles: 60        # all open roles on the company's board, interns and full-time
  max_yc_team_size: 1000

# Aggregator lists (Simplify + others) as a backstop for companies with no API (Meta, Tesla, ...).
aggregators: true
