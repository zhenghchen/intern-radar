# What counts as a match for Zheng. Edit freely; the poller re-reads this every run.

# A title must match one of these to count as an internship/co-op.
intern_patterns:
  - '\bintern\b'
  - '\binterns\b'
  - '\binternship'
  - '\bco-?op\b'
  - '\bstudent (?:software|engineer|developer)'
  - '\bsummer 2027\b'

# Titles with any of these are dropped.
exclude_title_patterns:
  # degree-gated (bachelor's only for now; "BS/MS" and "Undergraduate" still count)
  - '\bph\.?d\b'
  - '\bgraduate\b'
  - '(?<![/\w])m\.?s\b(?!/)'
  - '\bmsc\b'
  - '^(?!.*quant).*\bresearch intern'
  - 'doctoral'
  - "\\bmaster'?s\\b"
  - '\bmba\b'
  - 'student researcher'
  - 'research scientist'
  - 'post-?doc'
  # hardware design
  - '\basic\b'
  - '\bverilog\b'
  - '\brtl\b'
  - '\bvlsi\b'
  - '\bfpga\b'
  - 'analog'
  - 'mixed[- ]signal'
  - 'design verification'
  - 'physical design'
  - '\blayout\b'
  - 'hardware (?:design|engineer|development|test)'
  - '^(?!.*\b(?:engineer|developer|software)\b).*(?<!non-)silicon'   # but keep "Applied AI Engineer - Silicon Engineering"
  - '\brf\b'
  - 'mechanical'
  - 'electrical'
  - 'manufacturing engineer'
  - 'process engineer'
  - 'chemical'
  - 'ic design|characterization|design[- ]for[- ]test|signal integrity|power electronics|\bpcb\b|test technician'
  # non-engineering
  - '^(?!.*\b(?:engineer|developer|software)\b).*market(?:ing)?\b'   # but keep "Marketing Web Developer"
  - '\bsales\b'
  - 'account(?:ing|ant)'
  - 'finance intern|financial analyst|corporate finance|fp&a'
  - '\blegal\b|paralegal|counsel'
  - '^(?!.*\b(?:engineer|developer|software)\b).*(?:recruit|talent acquisition|\bhr\b|people ops|human resources)'   # but keep "Forward Deployed Engineer - HR Technology"
  - 'product manag|program manag|project manag|\bpm intern'
  - '^(?!.*\b(?:engineer|developer|software)\b).*business (?:analyst|development|operations|intern)'
  - '(?:business|sales|marketing|people|revenue|field|retail|store|finance|hr|clinical) operations'
  - 'supply chain (?:analyst|intern|planning)|logistics (?:intern|analyst|coordinator)|procurement'
  - 'communications intern|\bpr intern|social media|content (?:creator|writer|marketing|strategy|moderat)|copywrit'
  - 'graphic design|ux research|visual design|brand design'
  - 'customer success|support specialist'
  - 'actuar|underwrit|\baudit|\btax\b|investment bank|equity research|trading assistant'
  - '^(?!.*\bsoftware\b).*(?:civil(?! liberties)|construction|environmental|geolog|biolog|clinical|lab tech|pharma)'
  - 'high school'
  - 'apprentice(?:ship)? - (?:digital|business)'
  # wrong cycle (it's fall 2026 now)
  - '\b(?:summer|fall|autumn) 2026\b'
  - '\b2025\b'
  - '\bsummer 2028\b'

# Tech signal. A title matching any of these is clearly SWE / CS-adjacent.
tech_patterns:
  - 'software|\bswe\b|\bsde\b|developer|programm(?:er|ing)|coding'
  - 'back-?end|front-?end|full[- ]?stack|\bweb\b|mobile|\bios\b|android'
  - 'cloud|devops|\bsre\b|site reliability|distributed|kernel|operating system|compiler|database|firmware|embedded software|platform engineer'
  - 'machine learning|\bml\b|\bai\b|artificial intelligence|deep learning|llm|nlp|computer vision|data engineer|analytics engineer|data scien|applied (?:ai|ml)'
  - 'security|cyber|appsec'
  - 'technical staff|forward deployed|product engineer|research engineer|solutions engineer|founding engineer'
  - 'computer science|\bcs\b|linux|\bquant|game (?:dev|engineer|programm)|graphics|robotics|autonomy|autonomous|perception'
  - 'python|librar(?:y|ies)|\bit (?:intern|co-?op)|tech execution'

# Ambiguous words ("Engineering Intern", "Systems Engineer"): they could be civil, mechanical, aerospace...
# A title with only these still counts (ranked lower) unless it names a non-CS discipline.
# It isn't ranked lower when Simplify files it under a CS category or the company is a small startup.
weak_tech_patterns:
  - '\bengineer(?:s|ing)?\b|systems|infra|network|automation|tools|technology|technologist|r&d|research & development'
  - 'embedded|computer engineer|maps|\btest|platform|storage|application development'
cs_categories: ['Software', 'Software Engineering', 'AI/ML/Data', 'Data Science, AI & Machine Learning', 'Quant', 'Quantitative Finance']
non_cs_patterns:
  - 'structural|roadway|traffic|drainage|bridge|geotech|transportation|hvac|plumbing|mining|petroleum|pipeline|water'
  - 'industrial|quality|packaging|\bcad\b|mechatronic|controls? engineer|avionics|aerospace|propulsion|manufactur|materials|metallurg'
  - 'electronics|power systems|substation|utility|energy|nuclear|biomedical|medical device|optical|photonic|thermal|fluids|test technician'
  - 'harness|radiation|antenna|structures|composites|machinist|technician|assembly|integration (?:and|&) test|\bi&t\b|\bgnc\b|design engineer'

# Simplify (and Google) list the degrees a posting accepts. When they do, one of these must be among them.
allowed_degrees: ["Bachelor's", "Associate's"]

# Locations that disqualify a posting unless it also mentions US / remote US.
non_us_patterns:
  - 'united kingdom|\buk\b|england|london|edinburgh|manchester|cambridge, uk|belfast|dublin|ireland'
  - '\bindia\b|bangalore|bengaluru|hyderabad|pune|chennai|mumbai|delhi|noida|gurgaon|gurugram'
  - 'germany|berlin|munich|frankfurt|hamburg|france|paris|netherlands|amsterdam|spain|madrid|barcelona|italy|milan'
  - 'switzerland|zurich|zürich|geneva|sweden|stockholm|denmark|copenhagen|norway|oslo|finland|helsinki|poland|warsaw|krakow|czech|prague|romania|bucharest|portugal|lisbon|austria|vienna|belgium|brussels|hungary|budapest|greece|athens|estonia|tallinn|ukraine'
  - 'israel|tel aviv|singapore|japan|tokyo|korea|seoul|china|beijing|shanghai|shenzhen|hong kong|taiwan|taipei|australia|sydney|melbourne|new zealand|philippines|manila|vietnam|indonesia|malaysia|thailand'
  - 'malaysia|kuala lumpur|petaling jaya|selangor|penang|\bmys\b|qatar|doha|abu dhabi|peru|lima|serbia|belgrade|armenia|yerevan|curitiba|belo horizonte|guadalajara|monterrey|sophia antipolis|valbonne|aubervilliers|saint-sulpice|veghel|eindhoven|malmo|malmö|oberkochen|warszawa|wroclaw|gdansk|bratislava|sofia|zagreb|ljubljana|riyadh|cairo|lagos|nairobi|bangkok|jakarta|ho chi minh|hanoi|karachi|lahore|dhaka|colombo|pakistan|bangladesh|sri lanka'
  - ', (?:my|mx|pl|se|rs|fr|gb|nl|es|it|ch|at|be|dk|no|fi|pt|ie|cz|ro|hu|gr|sg|jp|kr|cn|hk|tw|au|nz|ph|vn|th|br|cl|pe|ae|sa|eg|ng|ke|za|tr|ua|bg|hr|si|sk|lt|lv|ee|am)$'
  - 'brazil|são paulo|sao paulo|mexico|argentina|buenos aires|colombia|bogot|chile|costa rica|uae|dubai|saudi|egypt|nigeria|kenya|south africa|turkey|istanbul|\bemea\b|\bapac\b|\blatam\b|europe'

# Region: a named US place wins; then a named foreign place; then Canada; then weak US hints
# (", IN" is Indiana or India, "Remote" can be anywhere).
us_patterns:
  - 'united states|\busa\b|\bus\b|u\.s\.|north america|puerto rico'
  - ', (?:ak|az|ct|fl|ga|hi|ia|ks|ky|la|ma|md|me|mi|mn|mo|ms|mt|nc|nd|ne|nh|nj|nm|nv|ny|oh|ok|or|pa|ri|sc|sd|tn|tx|ut|va|vt|wa|wi|wv|wy|dc)\b'
  - '^(?!.*canada|.*\b(?:on|bc|ab|qc|mb|sk|ns|nb|ca-on|ca-qc|ca-bc),? ca\b).*, ca\b(?!-)'
  - 'california|washington|new york|texas|massachusetts|oregon|colorado|illinois|georgia|virginia|arizona|utah|florida|north carolina|pennsylvania|michigan|minnesota|ohio|new jersey'
  - 'san francisco|\bsf\b|bay area|palo alto|mountain view|menlo park|sunnyvale|san jose|santa clara|cupertino|redwood city|san mateo|south san francisco|oakland|berkeley|fremont|seattle|bellevue|redmond|kirkland|portland|austin|boston|cambridge, ma|nyc|new york city|brooklyn|los angeles|santa monica|san diego|irvine|denver|boulder|chicago|atlanta|pittsburgh|raleigh|durham|phoenix|salt lake|hawthorne|los gatos|lehi|miami|dallas|houston|philadelphia|detroit|ann arbor|minneapolis|nashville|washington, dc'

us_weak_patterns:
  - 'remote|anywhere|flexible'
  - '(?:,|^) ?(?:al|ak|az|ar|ca|co|ct|de|fl|ga|hi|id|il|in|ia|ks|ky|la|me|md|ma|mi|mn|ms|mo|mt|ne|nv|nh|nj|nm|ny|nc|nd|oh|ok|or|pa|ri|sc|sd|tn|tx|ut|vt|va|wa|wv|wi|wy|dc)\b'
  - '\b(?:al|ak|az|ar|co|ct|fl|ga|hi|ia|ks|ky|md|ma|mi|mn|ms|mo|mt|ne|nv|nh|nj|nm|ny|nc|nd|oh|ok|pa|ri|sc|sd|tn|tx|ut|vt|wa|wv|wi|wy)\b(?:,? \d{5})?$'
  - 'nevada|missouri|kentucky|iowa|south dakota|wisconsin|indiana|tennessee|maryland|connecticut|alabama|kansas|oklahoma|nebraska|idaho|montana|new mexico|delaware|louisiana|arkansas|mississippi|south carolina|vermont|maine|new hampshire|rhode island|wyoming|alaska|hawaii|west virginia|north dakota'
  - 'torrance|long beach|scotts valley|las vegas|kansas city|sioux falls|stamford|parsippany|carmel|madison|spartanburg|richmond|erie|reston|herndon|mclean|arlington|columbus|cleveland|cincinnati|st\.? louis|indianapolis|charlotte|tampa|orlando|sacramento|baltimore|new haven|princeton|newark|jersey city|hoboken|providence|rochester|buffalo|albany|omaha|tucson|albuquerque|el segundo|culver city|burbank|pasadena|playa vista|emeryville|san ramon|pleasanton|milpitas|foster city|burlingame|livermore|huntsville|colorado springs|fort worth|plano|irving|san antonio|boise|des moines|milwaukee|louisville|memphis|knoxville|greenville|wilmington'

allow_canada: false   # US work authorization only; set true to keep Canadian roles (ranked 2 lower)
canada_patterns:
  - 'canada|toronto|vancouver|waterloo|montreal|montréal|ottawa|calgary|markham|mississauga|kanata|kitchener|longueuil|burnaby|edmonton|quebec|québec|halifax|winnipeg|\bon\b, ca|\bbc\b|^can\b|ca-qc|ca-on|ca-bc'

# Role fit: the best-matching line's points, +1 if another line matches too (so 0-4; backend/infra first,
# then SWE and AI). Location doesn't count: anywhere in the US is fine. Titles that only passed on an
# ambiguous word ("Engineering Intern") get -2.
score:
  title:
    'backend|back-end|infra|platform|distributed|systems|cloud|kernel|\bos\b|operating system|storage|database|reliability|\bsre\b|devops|kubernetes|\bgo\b|golang': 3
    'software engineer|software development|\bswe\b|\bsde\b|developer|technical staff|product engineer|forward deployed|founding engineer': 2
    'machine learning|\bml\b|\bai\b|llm|applied': 2
    'full[- ]?stack|security|data engineer|data scien|\bquant': 1
    'embedded|firmware|compiler|performance|gpu|cuda': 1
  location: {}
  watchlist_bonus: 0
  ambiguous_title_penalty: 2

# Alerts go only to the best: big-tech watchlist roles, and roles at companies with at least
# alert_min_signal (see signal in companies.yaml) whose role fit is at least alert_min_fit.
# Only postings at most alert_max_age_hours old (by posted date, or first-seen if none) alert.
# Everything else still goes on the board, silently.
alert_max_age_hours: 48
alert_min_signal: 3
alert_min_fit: 2
