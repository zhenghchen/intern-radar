# What counts as a match for Zheng. Edit freely; the poller re-reads this every run.

# A title must match one of these to count as an internship/co-op.
intern_patterns:
  - '\bintern\b'
  - '\binterns\b'
  - '\binternship'
  - '\bco-?op\b'
  - '\bstudent (?:software|engineer|developer)'
  - '\bsummer 2027\b'

# Titles with any of these are dropped.
exclude_title_patterns:
  # degree-gated
  - '\bph\.?d\b'
  - 'doctoral'
  - "\\bmaster'?s\\b"
  - '\bmba\b'
  - 'student researcher'
  - 'research scientist'
  - 'post-?doc'
  # hardware design
  - '\basic\b'
  - '\bverilog\b'
  - '\brtl\b'
  - '\bvlsi\b'
  - '\bfpga\b'
  - 'analog'
  - 'mixed[- ]signal'
  - 'design verification'
  - 'physical design'
  - '\blayout\b'
  - 'hardware (?:design|engineer|development|test)'
  - 'silicon'
  - '\brf\b'
  - 'mechanical'
  - 'electrical'
  - 'manufacturing engineer'
  - 'process engineer'
  - 'chemical'
  - 'ic design|characterization|design[- ]for[- ]test|signal integrity|power electronics|\bpcb\b|test technician'
  # non-engineering
  - 'market(?:ing)?\b'
  - '\bsales\b'
  - 'account(?:ing|ant)'
  - 'finance intern|financial analyst|corporate finance|fp&a'
  - '\blegal\b|paralegal|counsel'
  - 'recruit|talent acquisition|\bhr\b|people ops|human resources'
  - 'product manag|program manag|project manag|\bpm intern'
  - 'business (?:analyst|development|operations|intern)'
  - '(?:business|sales|marketing|people|revenue|field|retail|store|finance|hr|clinical) operations'
  - 'supply chain (?:analyst|intern|planning)|logistics (?:intern|analyst|coordinator)|procurement'
  - 'communications intern|\bpr intern|social media|content (?:creator|writer|marketing|strategy|moderat)|copywrit'
  - 'graphic design|ux research|visual design|brand design'
  - 'customer success|support specialist'
  - 'actuar|underwrit|\baudit|\btax\b|investment bank|equity research|trading assistant'
  - 'civil|construction|environmental|geolog|biolog|clinical|lab tech|pharma'
  - 'high school'
  - 'apprentice(?:ship)? - (?:digital|business)'
  # wrong cycle (it's fall 2026 now)
  - '\b(?:summer|fall|autumn) 2026\b'
  - '\b2025\b'
  - '\bsummer 2028\b'

# Tech signal. A title matching any of these is clearly SWE / CS-adjacent.
tech_patterns:
  - 'software|\bswe\b|\bsde\b|developer|programm(?:er|ing)|coding'
  - 'back-?end|front-?end|full[- ]?stack|\bweb\b|mobile|\bios\b|android'
  - 'cloud|devops|\bsre\b|site reliability|distributed|kernel|operating system|compiler|database|firmware|embedded software|platform engineer'
  - 'machine learning|\bml\b|\bai\b|artificial intelligence|deep learning|llm|nlp|computer vision|data engineer|analytics engineer|data scien|applied (?:ai|ml)'
  - 'security|cyber|appsec'
  - 'technical staff|forward deployed|product engineer|research engineer|solutions engineer|founding engineer'
  - 'computer science|\bcs\b|linux|\bquant|game (?:dev|engineer|programm)|graphics|robotics|autonomy|autonomous|perception'

# Ambiguous words ("Engineering Intern", "Systems Engineer"): they could be civil, mechanical, aerospace...
# A title with only these counts when Simplify files the listing under a CS category below,
# or the company is a YC startup - and never when it names a non-CS discipline.
weak_tech_patterns:
  - '\bengineer(?:s|ing)?\b|systems|infra|network|automation|tools|technology|technologist|r&d|research & development'
  - 'embedded|computer engineer|maps|\btest|platform|storage|application development'
cs_categories: ['Software', 'Software Engineering', 'AI/ML/Data', 'Data Science, AI & Machine Learning', 'Quant', 'Quantitative Finance']
non_cs_patterns:
  - 'structural|roadway|traffic|drainage|bridge|geotech|transportation|hvac|plumbing|mining|petroleum|pipeline|water'
  - 'industrial|quality|packaging|\bcad\b|mechatronic|controls? engineer|avionics|aerospace|propulsion|manufactur|materials|metallurg'
  - 'electronics|power systems|substation|utility|energy|nuclear|biomedical|medical device|optical|photonic|thermal|fluids|test technician'

# Locations that disqualify a posting unless it also mentions US / remote US.
non_us_patterns:
  - 'united kingdom|\buk\b|england|london|edinburgh|manchester|cambridge, uk|belfast|dublin|ireland'
  - 'india|bangalore|bengaluru|hyderabad|pune|chennai|mumbai|delhi|noida|gurgaon|gurugram'
  - 'germany|berlin|munich|frankfurt|hamburg|france|paris|netherlands|amsterdam|spain|madrid|barcelona|italy|milan'
  - 'switzerland|zurich|zürich|geneva|sweden|stockholm|denmark|copenhagen|norway|oslo|finland|helsinki|poland|warsaw|krakow|czech|prague|romania|bucharest|portugal|lisbon|austria|vienna|belgium|brussels|hungary|budapest|greece|athens|estonia|tallinn|ukraine'
  - 'israel|tel aviv|singapore|japan|tokyo|korea|seoul|china|beijing|shanghai|shenzhen|hong kong|taiwan|taipei|australia|sydney|melbourne|new zealand|philippines|manila|vietnam|indonesia|malaysia|thailand'
  - 'brazil|são paulo|sao paulo|mexico|argentina|buenos aires|colombia|bogot|chile|costa rica|uae|dubai|saudi|egypt|nigeria|kenya|south africa|turkey|istanbul|emea|apac|latam|europe'

us_patterns:
  - 'united states|\busa\b|\bus\b|u\.s\.|remote|anywhere|north america'
  - ', (?:al|ak|az|ar|ca|co|ct|de|fl|ga|hi|id|il|in|ia|ks|ky|la|me|md|ma|mi|mn|ms|mo|mt|ne|nv|nh|nj|nm|ny|nc|nd|oh|ok|or|pa|ri|sc|sd|tn|tx|ut|vt|va|wa|wv|wi|wy|dc)\b'
  - 'california|washington|new york|texas|massachusetts|oregon|colorado|illinois|georgia|virginia|arizona|utah|florida|north carolina|pennsylvania|michigan|minnesota|ohio|new jersey'
  - 'san francisco|\bsf\b|bay area|palo alto|mountain view|menlo park|sunnyvale|san jose|santa clara|cupertino|redwood city|san mateo|south san francisco|oakland|berkeley|fremont|seattle|bellevue|redmond|kirkland|portland|austin|boston|cambridge, ma|nyc|new york city|brooklyn|los angeles|santa monica|san diego|irvine|denver|boulder|chicago|atlanta|pittsburgh|raleigh|durham|phoenix|salt lake|hawthorne|los gatos|lehi|miami|dallas|houston|philadelphia|detroit|ann arbor|minneapolis|nashville|washington, dc'

canada_patterns:
  - 'canada|toronto|vancouver|waterloo|montreal|montréal|ottawa|calgary|markham|mississauga|\bon\b, ca|\bbc\b'

# Ranking: +points when the title (or location) matches.
score:
  title:
    'backend|back-end|infra|platform|distributed|systems|cloud|kernel|\bos\b|operating system|storage|database|reliability|\bsre\b|devops|kubernetes|\bgo\b|golang': 3
    'software engineer|software development|\bswe\b|\bsde\b|developer|technical staff|product engineer|forward deployed': 2
    'machine learning|\bml\b|\bai\b|llm|applied': 2
    'full[- ]?stack|security': 1
    'embedded|firmware|compiler|performance|gpu|cuda': 1
  location:
    'san francisco|\bsf\b|bay area|palo alto|mountain view|menlo park|sunnyvale|san jose|santa clara|cupertino|redwood city|san mateo|south san francisco|oakland|berkeley|fremont|los gatos': 2
    'remote': 1
    'seattle|bellevue|redmond|portland|oregon': 1
  watchlist_bonus: 2

# Alerts: only for postings whose posted date (or first-seen time, if the source gives none)
# is at most this many hours old. Older postings still go on the board, silently.
alert_max_age_hours: 48
# Minimum score for a phone alert (0 = every match).
alert_min_score: 0
