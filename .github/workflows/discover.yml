name: discover
on:
  schedule:
    - cron: "17 9 * * *"       # daily: learn new company boards from Simplify lists + YC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar.discover
      - name: Save results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/companies.json data/coverage.json
          git diff --cached --quiet && exit 0
          git commit -q -m "discover $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
