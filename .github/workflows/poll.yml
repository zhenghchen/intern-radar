name: poll
on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub runs this every few hours at best; it only restarts the chain below
  workflow_dispatch:
  repository_dispatch:
    types: [poll]
concurrency:
  group: poll
  cancel-in-progress: false
permissions:
  contents: write
  actions: write               # lets each run start the next one
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll job boards
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BOARD_URL: ${{ vars.BOARD_URL }}
        run: python -m radar.main
      - name: Save results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # commit when the roles changed, otherwise at most hourly, so the repo doesn't grow by 240 commits a day
          changed=$(python - <<'EOF'
          import json, subprocess
          old = subprocess.run(["git", "show", "HEAD:data/jobs.json"], capture_output=True, text=True).stdout
          key = lambda f: sorted((j["id"], j.get("score"), j.get("posted_at"), j.get("pay_label") or "") for j in f["jobs"])
          print(int(not old or key(json.loads(old)) != key(json.load(open("data/jobs.json")))))
          EOF
          )
          age=$(( $(date +%s) - $(git log -1 --format=%ct -- data/jobs.json) ))
          if [ "$changed" = 0 ] && [ "$age" -lt 3600 ]; then echo "no role changes"; exit 0; fi
          git add data/jobs.json data/state.json data/new_log.json
          git diff --cached --quiet && exit 0
          git commit -q -m "poll $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
      - name: Start the next poll
        # a failed run stops the chain (no failure-email loop); the schedule above restarts it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --ref main -R ${{ github.repository }}
